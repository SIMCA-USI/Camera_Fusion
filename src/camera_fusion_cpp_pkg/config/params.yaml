# params.yaml — Configuración del nodo de fusión panorámica de cámaras
# ─────────────────────────────────────────────────────────────────────
# Todos los parámetros de este archivo se pueden cambiar sin recompilar.

/**:
  ros__parameters:

    # ── Parámetros de Alpha Scaling (Calibración & Fusión) ───────────────────
    # alpha: Factor libre de escalado para la desdistorsión óptima (OpenCV):
    #   1.0 = Conserva el 100% de píxeles capturados por el sensor (sin pérdida de ángulos).
    #         El recorte de márgenes negros se realiza una sola vez al final sobre el lienzo.
    #   0.0 = Recorta monocularmente cada cámara (evita bordes negros pero pierde campo de visión).
    alpha: 1.0

    # auto_adjust_homography:
    # Adapta automáticamente la homografía existente (calculada originalmente con K sin escalar)
    # a las nuevas matrices intrínsecas óptimas para alpha=1.0.
    # Permite utilizar las calibraciones actuales sin necesidad de recalibrar físicamente.
    auto_adjust_homography: true

    # ── Tópicos de salida ROS 2 ──────────────────────────────────────────────
    output_topic: "/carrito/followme/video_frames"
    cam_info_topic: "/carrito/followme/camera_info"

    # ── Captura de Hardware ──────────────────────────────────────────────────
    # Tasa de frames por segundo solicitada al driver V4L2.
    fps: 30

    # Resolución física de captura USB (V4L2).
    # Opciones de referencia:
    #   480p  → cam_w: 640,  cam_h: 480   (por defecto, menor carga CPU)
    #   720p  → cam_w: 1280, cam_h: 720   (mayor detalle, mayor latencia USB)
    #   1080p → cam_w: 1920, cam_h: 1080  (máxima calidad, requiere USB 3.0)
    cam_w: 640
    cam_h: 480

    # ── Lienzo interno de composición ───────────────────────────────────────
    # Tamaño del "canvas" matemático sobre el que se warpean las dos cámaras.
    # Con alpha=1.0 las imágenes retienen todo el ancho; 1100x480 es idóneo para 480p.
    canvas_w: 1100
    canvas_h: 480

    # ── Zona de Difuminado (Alpha Blending) ─────────────────────────────────
    # Columnas X (en píxeles del lienzo) donde empieza y termina la transición suave.
    overlap_start: 475
    overlap_end:   525

    # ── Publicación de Feeds Individuales ───────────────────────────────────
    # Resolución a la que se publican los topics cam_1/image_raw y cam_2/image_raw.
    indiv_resize_w: 640
    indiv_resize_h: 480

    # ── Márgenes de Recorte Anti-Bordes Negros ───────────────────────────────
    # Píxeles que se descartan en cada borde de la imagen panorámica final
    # para eliminar las zonas negras producidas por el warping de perspectiva.
    margin_x: 30
    margin_y: 10

    # ── Interpolación OpenCV ─────────────────────────────────────────────────
    # 1 = INTER_LINEAR, 2 = INTER_CUBIC, 0 = INTER_NEAREST
    interp: 1

    # ── Orden de Cámaras ─────────────────────────────────────────────────────
    # Si las cámaras están invertidas físicamente, invertirlas al arrancar.
    swap_default: false
